name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm -w lint

      - name: typecheck
        run: pnpm -w typecheck

      - name: test
        run: pnpm -w test

      - name: build (affected)
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          pnpm build -- --filter=...[${BASE}]
